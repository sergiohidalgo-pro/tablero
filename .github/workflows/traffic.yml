# Weekly snapshot of repo traffic (GitHub keeps only 14 days) into the `traffic` branch,
# created on the first run if it does not exist yet.
# If the run fails with 403, GITHUB_TOKEN cannot read traffic: add a TRAFFIC_TOKEN secret
# (fine-grained PAT scoped to this repo, Administration: read-only).
# Snapshots overlap by a week on purpose; dedupe by timestamp when you read them.
name: traffic
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin traffic:traffic && git checkout traffic || { git checkout --orphan traffic && git rm -rfq .; }
          d=$(date -u +%F)
          for k in views clones popular/referrers; do
            gh api "repos/$REPO/traffic/$k" > "$d-${k##*/}.json"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(traffic): $(date -u +%F)"
          git push -u origin traffic
